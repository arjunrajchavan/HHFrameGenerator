server.port=${PORT:8080}
spring.application.name=HHframeGenerator

# ===============================
# HEADLESS MODE (CRITICAL for Linux/cloud image rendering)
# ===============================
# Must be false so Java AWT (BufferedImage, Graphics2D) works on headless servers
spring.main.headless=false

# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:local-dev-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:local-dev-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:local-dev-secret}

# Default fallback database properties if not provided by environment
MYSQLHOST=${DB_HOST:localhost}
MYSQLPORT=${DB_PORT:3306}
MYSQLDATABASE=${DB_NAME:hh_goa_badges}
MYSQLUSER=${DB_USER:root}
MYSQLPASSWORD=${DB_PASSWORD:root}

# Safeguard for environment configurations that pass unresolved placeholder port "${3306}"
3306=3306

# Automatically constructs the JDBC URL using standard variables
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARI CONNECTION POOL SETTINGS
# ===============================
# Crucial for live servers to prevent "Connection Timeout" or "Communications link failure"
# when the host drops idle connections (e.g. Render/Railway idle timeout is ~5 minutes).
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# SECURITY & MULTIPART UPLOAD LIMITS
# ===============================
# Prevent denial of service (DoS) attacks by limiting upload size to 5MB max
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
